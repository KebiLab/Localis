name: Desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-cli:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - run: npm run build:cli
      - name: Pack standalone CLI
        run: |
          mkdir release-assets
          npm pack -w localis-core --pack-destination release-assets
          npm pack -w localis --pack-destination release-assets
          cp scripts/install.sh scripts/install.ps1 release-assets/
      - name: Create release and upload CLI assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Localis $GITHUB_REF_NAME" --prerelease --generate-notes --notes "Private, local-first code audits, deliberate AI context, reviewable changes, and release checks."
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber

  desktop:
    needs: release-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build:core
      - run: npm run build:cli
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: Localis v__VERSION__
          releaseBody: |
            Localis 0.2 is the first public desktop and CLI preview.

            - Deterministic local repository audits
            - Privacy manifests and payload hashing
            - Ollama, LM Studio, and OpenAI-compatible providers
            - Reviewable AI change plans with apply and undo
            - Release readiness checks

            Download the installer for your platform below. Unsigned preview builds may trigger an operating-system warning.
          releaseDraft: false
          prerelease: true
          generateReleaseNotes: true
          args: ${{ matrix.args }}
          releaseAssetNamePattern: "Localis_[version]_[platform]_[arch][setup].[ext]"
