name: Bug report
description: Report a reproducible Localis problem.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove secrets, source code, and private paths before posting logs.
  - type: input
    id: version
    attributes:
      label: Localis version
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [CLI, Desktop, Website]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, provider, and relevant tool versions.
